# Wings of Fire OS — build configuration (sourced by build.sh and scripts/)

OS_NAME="Wings of Fire OS"
OS_ID="wingsoffire"
OS_VERSION="0.1"
OS_CODENAME="ember"
OS_HOSTNAME="wingsoffire"
LIVE_USERNAME="dragon"

# Every image in artwork/wallpapers/ is shipped; this one is the default desktop background.
DEFAULT_WALLPAPER="turtle.png"

LOCALE="en_AU.UTF-8"
TIMEZONE="Australia/Sydney"
KEYBOARD_LAYOUT="us"

DEBIAN_SUITE="trixie"
DEBIAN_MIRROR="http://deb.debian.org/debian"
ARCH="amd64"

# Package list from config/packages/<name>.list layered on top of base.list, or "none" for console only.
DESKTOP="xfce"
INSTALL_RECOMMENDS="yes"

# Include the Calamares graphical installer ("Install Wings of Fire OS" on the live desktop).
INSTALLER="yes"
