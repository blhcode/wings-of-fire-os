<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map in 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc7e0; font-family: "EB Garamond", Georgia, serif; }
  canvas { display: block; }
  .labels { position: absolute; inset: 0; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; color: #1b3348; }
  #status.error { color: #7a1c1c; }
  .marker { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0;
    padding: 0; cursor: pointer; font: inherit; transform: translateY(-50%); }
  .marker i { width: 10px; height: 10px; border-radius: 50%; background: var(--chip); border: 2px solid #1b1208; }
  .marker span { font-size: 15px; font-weight: 600; color: #fdf6e3; white-space: nowrap;
    text-shadow: 0 0 3px #000, 0 0 6px #000; }
  .marker.rank-1 span { font-size: 18px; letter-spacing: 0.04em; }
  .marker.selected span { color: #ffd76a; }
  .marker.selected i { transform: scale(1.4); }
  #info { position: absolute; left: 16px; bottom: 16px; max-width: 360px; padding: 12px 16px; border-radius: 10px;
    background: rgba(20, 16, 10, 0.78); color: #fdf6e3; display: flex; flex-direction: column; gap: 4px; }
  #info strong { font-size: 20px; }
  #info[hidden] { display: none; }
</style>
</head>
<body>
<div id="status">Unrolling the map…</div>
<div id="info" hidden></div>
<script src="viewer.js"></script>
</body>
</html>
